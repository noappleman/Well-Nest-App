services:
  - type: web
    name: trytry
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.13
      - key: GUNICORN_CMD_ARGS
        value: "--worker-tmp-dir /dev/shm --workers=4 --threads=2 --worker-class=gthread"
